name: CI

on: 
 push:
   branches: [master]
 pull_request: 
  branches: [main]
 permissions: 
  content: read
 jobs:
   test:
     runs-on: ubuntu-latest
     container:
       image: node:24
     steps:
       - uses: actions/checkout
         with:
           node-version: 24
       - run: npm ci
       - run: npm test
       - run: npm run build 

